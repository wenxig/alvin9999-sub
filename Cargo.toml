[package]
name = "alvin9999-sub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
curl = { version = "0.4", features = ["poll_7_68_0"] }
form_urlencoded = "1"
lexopt = "0.3"
percent-encoding = "2"
serde-saphyr = { version = "1.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
subconverter-core = { git = "https://github.com/Liki4/subconverter-rs", rev = "1ec1c445494537bb940a058dfd07d0d9970b8c5f" }

[features]
vendored-tls = ["curl/static-curl", "curl/static-ssl"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
