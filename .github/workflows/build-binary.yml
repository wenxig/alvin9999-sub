name: Build Binary

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-binary.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-binary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            src
            tests

      - name: Install Rust and libcurl
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config

      - name: Install Git LFS filters
        run: git lfs install --local

      - name: Compile Linux binary
        run: |
          cargo +stable test --locked
          cargo +stable build --release --locked
          install -D -m 755 target/release/alvin9999-sub bin/alvin9999-sub

      - name: Commit binary
        shell: bash
        run: |
          git add --sparse bin/alvin9999-sub
          if git diff --cached --quiet; then
            echo 'Binary is unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update compiled binary [skip ci]'
          git lfs push origin HEAD
          git push
