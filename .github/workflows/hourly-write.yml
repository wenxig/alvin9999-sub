name: Wiki Fetch & Update

on:
  schedule:
    - cron: "0 */1 * * *"

  workflow_run:
    workflows:
      - Build Binary
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-fetch
  cancel-in-progress: true

jobs:
  fetch-wiki:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            data

      - name: Download latest release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "Unsupported Ubuntu runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "alvin9999-sub-$arch-linux" \
            --output "$RUNNER_TEMP/alvin9999-sub"
          chmod +x "$RUNNER_TEMP/alvin9999-sub"

      - name: Fetch and extract Wiki pages
        timeout-minutes: 1
        run: '"$RUNNER_TEMP/alvin9999-sub"'

      - name: Update CI run timestamp
        shell: bash
        run: |
          export TZ='Asia/Shanghai'
          current_time=$(date '+%Y-%m-%d %H:%M:%S CST')
          printf '{"schemaVersion":1,"label":"CI 最近运行","message":"%s","color":"brightgreen"}\n' "$current_time" > data/ci-status.json

      - name: Commit & Push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ci-status.json data/sub.txt data/sub.yaml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m "chore: update CI status and subscriptions [skip ci]"
          git push
